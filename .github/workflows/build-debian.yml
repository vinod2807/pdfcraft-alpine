name: Build PdfCraft for Debian and Ubuntu

# This repository is a build harness. The upstream source is fetched at build
# time; no PdfCraft source is copied into this repository.
#
# Default target: the latest storytold/pdfcraft release merged with the current
# head of PR #2808. The merge is performed in the build container.

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to build
        type: string
        default: storytold/pdfcraft
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main
      track_upstream_pr:
        description: Build the latest upstream release plus PR #2808
        type: boolean
        default: true
      craft_fonts_ref:
        description: craft-fonts commit (empty to omit optional embedded faces)
        type: string
        default: 3d9ab3a132ed0eff457e424226a435a901da30d3
      release_tag:
        description: GitHub release tag to create or update
        type: string
        default: debian-ubuntu
      force:
        description: Build even when the source tree was already built
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly check: the plan job skips the build when the merged source tree
    # matches the one recorded in the current release's BUILD-INFO.txt.
    - cron: '53 4 * * 1'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      upstream: ${{ steps.decide.outputs.upstream }}
      ref: ${{ steps.decide.outputs.ref }}
      tag: ${{ steps.decide.outputs.tag }}
      pr_sha: ${{ steps.decide.outputs.pr_sha }}
      pr_repo: ${{ steps.decide.outputs.pr_repo }}
      pr_ref: ${{ steps.decide.outputs.pr_ref }}
      pr_open: ${{ steps.decide.outputs.pr_open }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM_INPUT: ${{ inputs.upstream || 'storytold/pdfcraft' }}
      REF_INPUT: ${{ inputs.ref || 'main' }}
      BASE_REPO: storytold/pdfcraft
      PR_NUMBER: "2808"
      TRACK_PR_INPUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.track_upstream_pr) || 'true' }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || 'debian-ubuntu' }}
      FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) || 'false' }}
    steps:
      - name: Decide whether this tree was already built
        id: decide
        run: |
          set -euo pipefail
          tag=""
          pr_sha=""
          pr_repo=""
          pr_ref=""
          pr_open=false
          if [ "$TRACK_PR_INPUT" = "true" ]; then
            # Resolve exactly what the build job will build: the newest
            # release tag merged with the PR head while the PR is open.
            tag="$(gh api "repos/$BASE_REPO/releases/latest" --jq .tag_name)"
            pr="$(gh api "repos/$BASE_REPO/pulls/$PR_NUMBER")"
            state="$(printf '%s' "$pr" | jq -r .state)"
            merged="$(printf '%s' "$pr" | jq -r .merged)"
            pr_sha="$(printf '%s' "$pr" | jq -r .head.sha)"
            pr_repo="$(printf '%s' "$pr" | jq -r .head.repo.clone_url)"
            pr_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
            if [ "$state" = "open" ] && [ "$merged" = "false" ]; then
              pr_open=true
            fi
            work="$(mktemp -d)"
            git -C "$work" init -q
            git -C "$work" remote add release "https://github.com/$BASE_REPO.git"
            # Full history: a shallow PR fetch has no common ancestor with
            # the tag, so the merge (and its tree) would be wrong.
            git -C "$work" fetch -q release "refs/tags/$tag"
            git -C "$work" checkout -q --detach FETCH_HEAD
            if [ "$pr_open" = "true" ]; then
              git -C "$work" fetch -q "$pr_repo" "refs/heads/$pr_ref"
              git -C "$work" -c user.name=plan -c user.email=plan@localhost \
                merge --no-ff -X theirs -q "$pr_sha" -m "plan"
            fi
            tree="$(git -C "$work" rev-parse 'HEAD^{tree}')"
            rm -rf "$work"
            echo "target: $tag + PR #$PR_NUMBER ($pr_sha), open=$pr_open"
          else
            sha="$(gh api "repos/$UPSTREAM_INPUT/commits/$REF_INPUT" --jq .sha)"
            tree="$(gh api "repos/$UPSTREAM_INPUT/commits/$sha" --jq .commit.tree.sha)"
            echo "target: $UPSTREAM_INPUT@$REF_INPUT ($sha)"
          fi
          echo "target tree: $tree"
          build=true
          if [ "$FORCE_INPUT" != "true" ]; then
            built_tree=""
            if gh release download "$RELEASE_TAG_INPUT" -p BUILD-INFO.txt \
                 -O /tmp/BUILD-INFO.txt --clobber 2>/dev/null; then
              built_tree="$(sed -n 's/^tree  *: *//p' /tmp/BUILD-INFO.txt | head -1)"
            fi
            echo "built tree:  ${built_tree:-<none>}"
            if [ -n "$built_tree" ] && [ "$built_tree" = "$tree" ]; then
              build=false
              echo "already built; skipping"
            fi
          fi
          {
            echo "build=$build"
            echo "upstream=$UPSTREAM_INPUT"
            echo "ref=$REF_INPUT"
            echo "tag=$tag"
            echo "pr_sha=$pr_sha"
            echo "pr_repo=$pr_repo"
            echo "pr_ref=$pr_ref"
            echo "pr_open=$pr_open"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      UPSTREAM: ${{ inputs.upstream || 'storytold/pdfcraft' }}
      REF: ${{ inputs.ref || 'main' }}
      TRACK_UPSTREAM_PR: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.track_upstream_pr) || 'true' }}
      BASE_REPO: storytold/pdfcraft
      PR_NUMBER: "2808"
      BASE_TAG: ${{ needs.plan.outputs.tag }}
      PR_SHA: ${{ needs.plan.outputs.pr_sha }}
      PR_REPO: ${{ needs.plan.outputs.pr_repo }}
      PR_REF: ${{ needs.plan.outputs.pr_ref }}
      PR_OPEN: ${{ needs.plan.outputs.pr_open }}
      CRAFT_FONTS_REF: ${{ inputs.craft_fonts_ref || '3d9ab3a132ed0eff457e424226a435a901da30d3' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'debian-ubuntu' }}
      # Debian 12's glibc floor is supported by Debian 12 and Ubuntu 22.04+.
      RUST_IMAGE: rust:1.99-bookworm
      PDFCRAFT_BUILD_LABEL: debian
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "3"

    steps:
      - uses: actions/checkout@v4
      - name: Prepare working directories
        run: mkdir -p work/cargo-home work/target work/src work/craft-fonts out
      - name: Build inside Debian container
        run: |
          docker pull "$RUST_IMAGE"
          docker run --rm \
            --volume "$PWD:/github" \
            --workdir /github \
            --env UPSTREAM --env REF --env TRACK_UPSTREAM_PR --env BASE_REPO --env PR_NUMBER \
            --env BASE_TAG --env PR_SHA --env PR_REPO --env PR_REF --env PR_OPEN \
            --env CRAFT_FONTS_REF \
            --env PDFCRAFT_BUILD_LABEL --env CARGO_NET_GIT_FETCH_WITH_CLI \
            --env CARGO_TERM_COLOR --env CARGO_BUILD_JOBS \
            --env CARGO_HOME=/github/work/cargo-home \
            --env CARGO_TARGET_DIR=/github/work/target \
            "$RUST_IMAGE" sh /github/scripts/build-debian.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-debian-amd64
          path: out/*
          if-no-files-found: error
      - name: Publish release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --clobber
          else
            gh release create "$RELEASE_TAG" out/* --prerelease \
              --title "PdfCraft for Debian/Ubuntu (amd64)" \
              --notes "Unofficial Debian/Ubuntu package built from $UPSTREAM at $REF."
          fi
