name: Build PdfCraft for Debian and Ubuntu

# This repository is a build harness. The upstream source is fetched at build
# time; no PdfCraft source is copied into this repository.
#
# Default target: the pr79-carrier branch of vinod2807/pdfcraft, kept by a scheduled
# workflow in that fork as a merge of the newest storytold/pdfcraft release tag and
# the head of PR #2808. A scheduled run here builds only when the carrier branch's
# tree differs from the tree recorded in the current release's BUILD-INFO.txt.

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to build
        type: string
        default: vinod2807/pdfcraft
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: pr79-carrier
      craft_fonts_ref:
        description: craft-fonts commit (empty to omit optional embedded faces)
        type: string
        default: 3d9ab3a132ed0eff457e424226a435a901da30d3
      release_tag:
        description: GitHub release tag to create or update
        type: string
        default: debian-ubuntu
      force:
        description: Build even when the source tree was already built
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 */6 * * *'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      upstream: ${{ steps.decide.outputs.upstream }}
      ref: ${{ steps.decide.outputs.ref }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_INPUT: ${{ inputs.upstream || 'vinod2807/pdfcraft' }}
      REF_INPUT: ${{ inputs.ref || 'pr79-carrier' }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || 'debian-ubuntu' }}
      FORCE_INPUT: ${{ inputs.force || 'false' }}
    steps:
      - name: Decide whether this tree was already built
        id: decide
        run: |
          set -euo pipefail
          head=$(gh api "repos/$UPSTREAM_INPUT/git/ref/heads/$REF_INPUT" --jq .object.sha 2>/dev/null \
                 || gh api "repos/$UPSTREAM_INPUT/commits/$REF_INPUT" --jq .sha)
          tree=$(gh api "repos/$UPSTREAM_INPUT/commits/$head" --jq .commit.tree.sha)
          built_tree=""
          if gh release download "$RELEASE_TAG_INPUT" -p BUILD-INFO.txt -O /tmp/BUILD-INFO.txt --clobber 2>/dev/null; then
            built_tree=$(sed -n 's/^tree  *: *//p' /tmp/BUILD-INFO.txt | head -1)
          fi
          build=true
          if [ -n "$built_tree" ] && [ "$built_tree" = "$tree" ] && [ "$FORCE_INPUT" != "true" ]; then
            build=false
          fi
          echo "carrier head=$head tree=$tree built_tree=$built_tree build=$build"
          {
            echo "build=$build"
            echo "upstream=$UPSTREAM_INPUT"
            echo "ref=$REF_INPUT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      UPSTREAM: ${{ needs.plan.outputs.upstream }}
      REF: ${{ needs.plan.outputs.ref }}
      CRAFT_FONTS_REF: ${{ inputs.craft_fonts_ref || '3d9ab3a132ed0eff457e424226a435a901da30d3' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'debian-ubuntu' }}
      # Debian 12's glibc floor is supported by Debian 12 and Ubuntu 22.04+.
      RUST_IMAGE: rust:1.99-bookworm
      PDFCRAFT_BUILD_LABEL: debian
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "3"

    steps:
      - uses: actions/checkout@v4
      - name: Prepare working directories
        run: mkdir -p work/cargo-home work/target work/src work/craft-fonts out
      - name: Build inside Debian container
        run: |
          docker pull "$RUST_IMAGE"
          docker run --rm \
            --volume "$PWD:/github" \
            --workdir /github \
            --env UPSTREAM --env REF --env CRAFT_FONTS_REF \
            --env PDFCRAFT_BUILD_LABEL --env CARGO_NET_GIT_FETCH_WITH_CLI \
            --env CARGO_TERM_COLOR --env CARGO_BUILD_JOBS \
            --env CARGO_HOME=/github/work/cargo-home \
            --env CARGO_TARGET_DIR=/github/work/target \
            "$RUST_IMAGE" sh /github/scripts/build-debian.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-debian-amd64
          path: out/*
          if-no-files-found: error
      - name: Publish release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --clobber
          else
            gh release create "$RELEASE_TAG" out/* --prerelease \
              --title "PdfCraft for Debian/Ubuntu (amd64)" \
              --notes "Unofficial Debian/Ubuntu package built from $UPSTREAM at $REF."
          fi
