name: Build PdfCraft for Alpine Linux (musl)

# Builds an unofficial PdfCraft binary for Alpine Linux (x86_64, musl libc) and
# publishes it as a GitHub Release. The source is fetched from the upstream
# repository at build time; this repository holds only the build harness.
#
# Default target: the pr79-carrier branch of vinod2807/pdfcraft. A scheduled
# workflow (.github/workflows/track-pr79.yml in that fork) keeps pr79-carrier as a
# merge of the newest storytold/pdfcraft release tag and the head of PR #2808. A
# scheduled run here builds only when the carrier branch's tree differs from the
# tree recorded in the current release's BUILD-INFO.txt, so a new release appears
# when upstream cuts one or the PR gets new commits. Use the force input to rebuild
# the same tree (e.g. after a harness change).

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository (owner/name) that carries the fix
        type: string
        default: vinod2807/pdfcraft
      ref:
        description: Branch name or commit SHA to build
        type: string
        default: pr79-carrier
      craft_fonts_ref:
        description: storytold/craft-fonts commit to embed (empty to skip)
        type: string
        default: 3d9ab3a132ed0eff457e424226a435a901da30d3
      release_tag:
        description: Release tag to publish the binaries to
        type: string
        default: pr79-alpine
      force:
        description: Build even when the source tree was already built
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: write

concurrency:
  group: alpine-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      upstream: ${{ steps.decide.outputs.upstream }}
      ref: ${{ steps.decide.outputs.ref }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_INPUT: ${{ inputs.upstream || 'vinod2807/pdfcraft' }}
      REF_INPUT: ${{ inputs.ref || 'pr79-carrier' }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || 'pr79-alpine' }}
      FORCE_INPUT: ${{ inputs.force || 'false' }}
    steps:
      - name: Decide whether this tree was already built
        id: decide
        run: |
          set -euo pipefail
          head=$(gh api "repos/$UPSTREAM_INPUT/git/ref/heads/$REF_INPUT" --jq .object.sha 2>/dev/null \
                 || gh api "repos/$UPSTREAM_INPUT/commits/$REF_INPUT" --jq .sha)
          tree=$(gh api "repos/$UPSTREAM_INPUT/commits/$head" --jq .commit.tree.sha)
          built_tree=""
          if gh release download "$RELEASE_TAG_INPUT" -p BUILD-INFO.txt -O /tmp/BUILD-INFO.txt --clobber 2>/dev/null; then
            built_tree=$(sed -n 's/^tree  *: *//p' /tmp/BUILD-INFO.txt | head -1)
          fi
          build=true
          if [ -n "$built_tree" ] && [ "$built_tree" = "$tree" ] && [ "$FORCE_INPUT" != "true" ]; then
            build=false
          fi
          echo "carrier head=$head tree=$tree built_tree=$built_tree build=$build"
          {
            echo "build=$build"
            echo "upstream=$UPSTREAM_INPUT"
            echo "ref=$REF_INPUT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      UPSTREAM: ${{ needs.plan.outputs.upstream }}
      REF: ${{ needs.plan.outputs.ref }}
      CRAFT_FONTS_REF: ${{ inputs.craft_fonts_ref || '3d9ab3a132ed0eff457e424226a435a901da30d3' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'pr79-alpine' }}
      # Pinned so a surprise rust:alpine bump cannot silently change the build.
      RUST_IMAGE: rust:1.99-alpine3.24
      PDFCRAFT_BUILD_LABEL: alpine
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "3"

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Prepare working directories
        run: mkdir -p work/src work/cargo-home work/target work/stage out

      - name: Fetch the Alpine Rust image
        run: docker pull "$RUST_IMAGE"

      # The registry/git cache and the compiler cache live on the host (bind
      # mounts) so a failed build can be resumed without recompiling the world.
      - name: Cache cargo home, target and checkouts
        uses: actions/cache@v4
        with:
          path: |
            work/cargo-home
            work/target
            work/src
            work/craft-fonts
          key: alpine-v2-${{ env.REF }}-${{ github.run_id }}
          restore-keys: |
            alpine-v2-${{ env.REF }}-

      - name: Build inside the Alpine container
        run: |
          docker run --rm \
            --volume "$PWD:/github" \
            --workdir /github \
            --env UPSTREAM --env REF --env CRAFT_FONTS_REF --env PDFCRAFT_BUILD_LABEL \
            --env CARGO_HOME=/github/work/cargo-home \
            --env CARGO_TARGET_DIR=/github/work/target \
            --env CARGO_NET_GIT_FETCH_WITH_CLI --env CARGO_TERM_COLOR --env CARGO_BUILD_JOBS \
            "$RUST_IMAGE" \
            sh /github/scripts/build-alpine.sh

      - name: Show what was produced
        if: always()
        run: |
          ls -lR out | head -100
          df -h /

      # The container runs as root; hand the output back to the runner user so
      # the artifact and cache steps can read it.
      - name: Fix ownership of build output
        if: always()
        run: |
          docker run --rm --volume "$PWD:/github" \
            --env U="$(id -u)" --env G="$(id -g)" \
            "$RUST_IMAGE" sh -c 'chown -R "$U:$G" /github/out /github/work 2>/dev/null || true'

      - name: Verify the tarball
        run: |
          set -e
          tgz="$(ls out/*.tar.gz)"
          echo "checking $tgz"
          tar -tzf "$tgz" | grep -q '/usr/bin/pdfcraft$' || { echo "::error::the tarball has no pdfcraft binary"; exit 1; }
          tar -tzf "$tgz" | grep -q '/usr/bin/pdfcraft-cli$' || { echo "::error::the tarball has no pdfcraft-cli binary"; exit 1; }
          tar -tzf "$tgz" | grep -q 'text-recognition.rten' || echo "::warning::the OCR models are missing from the tarball (Scan & OCR will be unavailable)"

      - name: Verify the .apk
        run: |
          set -e
          apkfile="$(ls out/*.apk)"
          echo "checking $apkfile ($(stat -c%s "$apkfile") bytes)"
          # An .apk is gzip(control tar) followed by gzip(data tar) with no
          # terminator in between, so one gunzip + tar -t lists both sections.
          list="$(gzip -dc "$apkfile" | tar -tf - || true)"
          echo "$list" | grep -qx '\.PKGINFO' || { echo "::error::the .apk has no control section"; exit 1; }
          echo "$list" | grep -q 'usr/bin/pdfcraft$' || { echo "::error::the .apk has no pdfcraft binary"; exit 1; }
          echo "$list" | grep -q 'usr/bin/pdfcraft-cli$' || { echo "::error::the .apk has no pdfcraft-cli binary"; exit 1; }
          echo "$list" | grep -q 'text-recognition.rten' || echo "::warning::the OCR models are missing from the .apk"
          echo "$list" | wc -l

      - name: Upload workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-alpine-x86_64
          path: out/*
          if-no-files-found: error

      - name: Publish the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* \
              --title "PdfCraft for Alpine Linux (musl) — upstream release + PR #2808" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
