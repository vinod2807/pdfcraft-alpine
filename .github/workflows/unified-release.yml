name: Unified PdfCraft Release

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC (after Alpine 04:43 and Debian 04:53 builds)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to release (e.g. 0.14.0). Empty = latest upstream release.'
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  create-unified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream latest release version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
            echo "Using specified version: $VERSION"
          else
            RELEASE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/storytold/pdfcraft/releases/latest")
            TAG=$(echo "$RELEASE" | jq -r .tag_name)
            VERSION=${TAG#v}
            echo "Latest upstream release: $TAG ($VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if unified release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="pdfcraft-$VERSION"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Unified release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unified release for $VERSION, will create"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest successful Alpine build
        if: steps.check.outputs.exists == 'false'
        id: alpine-find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Find latest successful Alpine build run
          RUN=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=20" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | select(.conclusion == "success") | .id' \
            | head -1)
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful Alpine build found"
            exit 1
          fi
          echo "alpine_run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "Found Alpine build: $RUN"

      - name: Find latest successful Debian build
        if: steps.check.outputs.exists == 'false'
        id: debian-find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Find latest successful Debian build run
          RUN=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=20" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | select(.conclusion == "success") | .id' \
            | head -1)
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful Debian build found"
            exit 1
          fi
          echo "debian_run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "Found Debian build: $RUN"

      - name: Verify builds are for same version
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ALPINE_RUN="${{ steps.alpine-find.outputs.alpine_run_id }}"
          DEBIAN_RUN="${{ steps.debian-find.outputs.debian_run_id }}"
          
          # Get artifacts from Alpine build to extract version
          ALPINE_ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ALPINE_RUN/artifacts" \
            | jq -r '.artifacts[].name')
          
          echo "Alpine artifacts: $ALPINE_ARTIFACTS"
          
          # Extract version from artifact name
          BUILD_VERSION=$(echo "$ALPINE_ARTIFACTS" | grep -oE 'pdfcraft-[0-9]+\.[0-9]+\.[0-9]+-alpine-x86_64' | head -1 | sed 's/pdfcraft-\(.*\)-alpine-x86_64/\1/')
          
          if [ -z "$BUILD_VERSION" ]; then
            echo "Could not extract version from Alpine artifacts"
            exit 1
          fi
          
          EXPECTED_VERSION="${{ steps.upstream.outputs.version }}"
          if [ "$BUILD_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: expected $EXPECTED_VERSION, got $BUILD_VERSION"
            echo "Waiting for builds to catch up..."
            exit 1
          fi
          
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Builds are for version $BUILD_VERSION"

      - name: Download Alpine artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.alpine-find.outputs.alpine_run_id }}
          path: alpine-artifacts
          pattern: pdfcraft-alpine-x86_64
          merge-multiple: true

      - name: Download Debian artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.debian-find.outputs.debian_run_id }}
          path: debian-artifacts
          pattern: pdfcraft-debian-amd64
          merge-multiple: true

      - name: Prepare unified release
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          cp alpine-artifacts/* release-assets/ 2>/dev/null || true
          cp debian-artifacts/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create unified release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="pdfcraft-$VERSION"
          
          gh release create "$TAG" release-assets/* \
            --title "PdfCraft $VERSION (Unified Release)" \
            --notes "Unofficial builds from storytold/pdfcraft $TAG:
* Alpine Linux (musl): .apk, .tar.gz
* Debian/Ubuntu (glibc): .deb, .rpm" \
            --prerelease=false
          
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"