name: Unified PdfCraft Release

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC (after Alpine 04:43 and Debian 04:53 builds)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to release (e.g. 0.14.0). Empty = latest upstream release.'
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  create-unified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream latest release version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
            echo "Using specified version: $VERSION"
          else
            RELEASE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/storytold/pdfcraft/releases/latest")
            TAG=$(echo "$RELEASE" | jq -r .tag_name)
            VERSION=${TAG#v}
            echo "Latest upstream release: $TAG ($VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if unified release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="pdfcraft-$VERSION"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Unified release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unified release for $VERSION, will create"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or trigger Alpine build
        if: steps.check.outputs.exists == 'false'
        id: alpine-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          
          # Look for existing successful Alpine build with artifacts for this version
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | select(.conclusion == "success") | .id')
          
          RUN=""
          for r in $RUNS; do
            ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r/artifacts" \
              | jq -r '.artifacts[]?.name' | grep -c "pdfcraft-$VERSION-alpine-x86_64" 2>/dev/null || echo 0)
            ARTIFACTS=$(echo "$ARTIFACTS" | tail -1)
            if [ "$ARTIFACTS" -gt 0 ]; then
              RUN=$r
              break
            fi
          done
          
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No existing Alpine build for version $VERSION, triggering new build..."
            gh workflow run build.yml \
              -f track_upstream_pr=false \
              -f ref="$TAG" \
              -f force=true
            sleep 10
            # Find the run we just triggered
            RUN=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10" \
              | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | select(.event == "workflow_dispatch") | .id' \
              | head -1)
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "Failed to trigger Alpine build"
              exit 1
            fi
            echo "Triggered Alpine build: $RUN"
          else
            echo "Found existing Alpine build: $RUN"
          fi
          
          echo "alpine_run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "alpine_triggered=$([ -z "$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.event == "workflow_dispatch"') ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Wait for Alpine build
        if: steps.check.outputs.exists == 'false' && steps.alpine-build.outputs.alpine_triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ steps.alpine-build.outputs.alpine_run_id }}"
          echo "Waiting for Alpine build $RUN..."
          while true; do
            STATUS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.status')
            CONCLUSION=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.conclusion // ""')
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Alpine build succeeded"
                break
              else
                echo "Alpine build failed: $CONCLUSION"
                exit 1
              fi
            fi
            sleep 30
          done

      - name: Find or trigger Debian build
        if: steps.check.outputs.exists == 'false'
        id: debian-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          
          # Look for existing successful Debian build with artifacts for this version
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | select(.conclusion == "success") | .id')
          
          RUN=""
          for r in $RUNS; do
            ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r/artifacts" \
              | jq -r '.artifacts[]?.name' | grep -c "pdfcraft-$VERSION-debian-amd64" 2>/dev/null || echo 0)
            ARTIFACTS=$(echo "$ARTIFACTS" | tail -1)
            if [ "$ARTIFACTS" -gt 0 ]; then
              RUN=$r
              break
            fi
          done
          
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No existing Debian build for version $VERSION, triggering new build..."
            gh workflow run build-debian.yml \
              -f track_upstream_pr=false \
              -f ref="$TAG" \
              -f force=true
            sleep 10
            # Find the run we just triggered
            RUN=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10" \
              | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | select(.event == "workflow_dispatch") | .id' \
              | head -1)
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "Failed to trigger Debian build"
              exit 1
            fi
            echo "Triggered Debian build: $RUN"
          else
            echo "Found existing Debian build: $RUN"
          fi
          
          echo "debian_run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "debian_triggered=$([ -z "$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.event == "workflow_dispatch"') ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Wait for Debian build
        if: steps.check.outputs.exists == 'false' && steps.debian-build.outputs.debian_triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ steps.debian-build.outputs.debian_run_id }}"
          echo "Waiting for Debian build $RUN..."
          while true; do
            STATUS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.status')
            CONCLUSION=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN" | jq -r '.conclusion // ""')
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Debian build succeeded"
                break
              else
                echo "Debian build failed: $CONCLUSION"
                exit 1
              fi
            fi
            sleep 30
          done

      - name: Download Alpine artifacts
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p alpine-artifacts
          RUN="${{ steps.alpine-build.outputs.alpine_run_id }}"
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
            | jq -r '.artifacts[] | select(.name == "pdfcraft-alpine-x86_64") | .archive_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Alpine artifact download URL"
            exit 1
          fi
          echo "Downloading Alpine artifact from $DOWNLOAD_URL"
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o alpine-artifacts/alpine.zip "$DOWNLOAD_URL"
          unzip -o alpine-artifacts/alpine.zip -d alpine-artifacts
          rm alpine-artifacts/alpine.zip
          ls -la alpine-artifacts/

      - name: Download Debian artifacts
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p debian-artifacts
          RUN="${{ steps.debian-build.outputs.debian_run_id }}"
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
            | jq -r '.artifacts[] | select(.name == "pdfcraft-debian-amd64") | .archive_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Debian artifact download URL"
            exit 1
          fi
          echo "Downloading Debian artifact from $DOWNLOAD_URL"
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o debian-artifacts/debian.zip "$DOWNLOAD_URL"
          unzip -o debian-artifacts/debian.zip -d debian-artifacts
          rm debian-artifacts/debian.zip
          ls -la debian-artifacts/

      - name: Prepare unified release
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          cp alpine-artifacts/* release-assets/ 2>/dev/null || true
          cp debian-artifacts/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create unified release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="pdfcraft-$VERSION"
          
          gh release create "$TAG" release-assets/* \
            --title "PdfCraft $VERSION (Unified Release)" \
            --notes $'Unofficial builds from storytold/pdfcraft $TAG:\n• Alpine Linux (musl): .apk, .tar.gz\n• Debian/Ubuntu (glibc): .deb, .rpm' \
            --prerelease=false
          
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"