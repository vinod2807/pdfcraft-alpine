name: Unified PdfCraft Release

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC (after Alpine 04:43 and Debian 04:53 builds)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to release (e.g. 0.14.0). Empty = use latest successful builds.'
        type: string
        required: false
      force_build:
        description: 'Force new builds even if plan job would skip them'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  create-unified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream latest release version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
            echo "Using specified version: $VERSION"
          else
            RELEASE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/storytold/pdfcraft/releases/latest")
            TAG=$(echo "$RELEASE" | jq -r .tag_name)
            VERSION=${TAG#v}
            echo "Latest upstream release: $TAG ($VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Alpine build with artifacts
        id: alpine-find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REQUESTED_VERSION="${{ github.event.inputs.version }}"
          # Find latest successful Alpine build run that has artifacts
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | select(.conclusion == "success") | .id')
          
          RUN=""
          for r in $RUNS; do
            ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r/artifacts" \
              | jq -r '.artifacts[]?.name' | grep -c 'pdfcraft-alpine-x86_64' 2>/dev/null || echo 0)
            ARTIFACTS=$(echo "$ARTIFACTS" | tail -1)
            if [ "$ARTIFACTS" -gt 0 ]; then
              RUN=$r
              break
            fi
          done
          
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful Alpine build with artifacts found"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            # Check version if requested
            if [ -n "$REQUESTED_VERSION" ]; then
              DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
                | jq -r '.artifacts[] | select(.name == "pdfcraft-alpine-x86_64") | .archive_download_url')
              if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
                mkdir -p /tmp/version-check
                curl -L -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -o /tmp/version-check/alpine.zip "$DOWNLOAD_URL" 2>/dev/null
                unzip -o /tmp/version-check/alpine.zip -d /tmp/version-check >/dev/null 2>&1
                BUILD_INFO=$(find /tmp/version-check -name "BUILD-INFO.txt" | head -1)
                if [ -f "$BUILD_INFO" ]; then
                  BUILD_VERSION=$(grep -oE 'PdfCraft [0-9]+\.[0-9]+\.[0-9]+' "$BUILD_INFO" | head -1 | sed 's/PdfCraft //')
                  if [ "$BUILD_VERSION" = "$REQUESTED_VERSION" ]; then
                    echo "alpine_run_id=$RUN" >> "$GITHUB_OUTPUT"
                    echo "Found Alpine build: $RUN (version $BUILD_VERSION matches requested)"
                    echo "needs_build=false" >> "$GITHUB_OUTPUT"
                    rm -rf /tmp/version-check
                    exit 0
                  else
                    echo "Alpine build $RUN is for version $BUILD_VERSION, requested $REQUESTED_VERSION"
                  fi
                fi
                rm -rf /tmp/version-check
              fi
              echo "Version mismatch, will trigger new build"
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "alpine_run_id=$RUN" >> "$GITHUB_OUTPUT"
              echo "Found Alpine build: $RUN"
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Find latest successful Debian build with artifacts
        id: debian-find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REQUESTED_VERSION="${{ github.event.inputs.version }}"
          # Find latest successful Debian build run that has artifacts
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | select(.conclusion == "success") | .id')
          
          RUN=""
          for r in $RUNS; do
            ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r/artifacts" \
              | jq -r '.artifacts[]?.name' | grep -c 'pdfcraft-debian-amd64' 2>/dev/null || echo 0)
            ARTIFACTS=$(echo "$ARTIFACTS" | tail -1)
            if [ "$ARTIFACTS" -gt 0 ]; then
              RUN=$r
              break
            fi
          done
          
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful Debian build with artifacts found"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            # Check version if requested
            if [ -n "$REQUESTED_VERSION" ]; then
              DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
                | jq -r '.artifacts[] | select(.name == "pdfcraft-debian-amd64") | .archive_download_url')
              if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
                mkdir -p /tmp/version-check
                curl -L -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -o /tmp/version-check/debian.zip "$DOWNLOAD_URL" 2>/dev/null
                unzip -o /tmp/version-check/debian.zip -d /tmp/version-check >/dev/null 2>&1
                BUILD_INFO=$(find /tmp/version-check -name "BUILD-INFO.txt" | head -1)
                if [ -f "$BUILD_INFO" ]; then
                  BUILD_VERSION=$(grep -oE 'PdfCraft [0-9]+\.[0-9]+\.[0-9]+' "$BUILD_INFO" | head -1 | sed 's/PdfCraft //')
                  if [ "$BUILD_VERSION" = "$REQUESTED_VERSION" ]; then
                    echo "debian_run_id=$RUN" >> "$GITHUB_OUTPUT"
                    echo "Found Debian build: $RUN (version $BUILD_VERSION matches requested)"
                    echo "needs_build=false" >> "$GITHUB_OUTPUT"
                    rm -rf /tmp/version-check
                    exit 0
                  else
                    echo "Debian build $RUN is for version $BUILD_VERSION, requested $REQUESTED_VERSION"
                  fi
                fi
                rm -rf /tmp/version-check
              fi
              echo "Version mismatch, will trigger new build"
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "debian_run_id=$RUN" >> "$GITHUB_OUTPUT"
              echo "Found Debian build: $RUN"
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger Alpine build if needed
        if: steps.alpine-find.outputs.needs_build == 'true' || github.event.inputs.force_build == 'true'
        id: alpine-trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering Alpine build with force=true..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main","inputs":{"force":"true"}}')
          echo "Dispatch response: $RESPONSE"
          
          # Wait a bit for the run to be created
          sleep 10
          
          # Find the newly created run
          for i in {1..30}; do
            RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5&branch=main&event=workflow_dispatch" \
              | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | .id')
            NEW_RUN=$(echo "$RUNS" | head -1)
            if [ -n "$NEW_RUN" ] && [ "$NEW_RUN" != "null" ]; then
              echo "alpine_run_id=$NEW_RUN" >> "$GITHUB_OUTPUT"
              echo "Triggered Alpine build: $NEW_RUN"
              break
            fi
            sleep 10
          done
          
          if [ -z "$NEW_RUN" ]; then
            echo "Failed to trigger Alpine build"
            exit 1
          fi

      - name: Trigger Debian build if needed
        if: steps.debian-find.outputs.needs_build == 'true' || github.event.inputs.force_build == 'true'
        id: debian-trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering Debian build with force=true..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-debian.yml/dispatches" \
            -d '{"ref":"main","inputs":{"force":"true"}}')
          echo "Dispatch response: $RESPONSE"
          
          # Wait a bit for the run to be created
          sleep 10
          
          # Find the newly created run
          for i in {1..30}; do
            RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5&branch=main&event=workflow_dispatch" \
              | jq -r '.workflow_runs[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | .id')
            NEW_RUN=$(echo "$RUNS" | head -1)
            if [ -n "$NEW_RUN" ] && [ "$NEW_RUN" != "null" ]; then
              echo "debian_run_id=$NEW_RUN" >> "$GITHUB_OUTPUT"
              echo "Triggered Debian build: $NEW_RUN"
              break
            fi
            sleep 10
          done
          
          if [ -z "$NEW_RUN" ]; then
            echo "Failed to trigger Debian build"
            exit 1
          fi

      - name: Wait for Alpine build to complete
        if: steps.alpine-find.outputs.needs_build == 'true' || github.event.inputs.force_build == 'true'
        id: alpine-wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.alpine-trigger.outputs.alpine_run_id }}"
          echo "Waiting for Alpine build $RUN_ID to complete..."
          
          for i in {1..180}; do  # Wait up to 30 minutes (180 * 10s)
            STATUS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              | jq -r '.conclusion')
            
            if [ "$STATUS" = "success" ]; then
              echo "Alpine build completed successfully"
              echo "alpine_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ] || [ "$STATUS" = "timed_out" ]; then
              echo "Alpine build failed with status: $STATUS"
              exit 1
            fi
            echo "Alpine build still running (status: ${STATUS:-unknown}), waiting..."
            sleep 10
          done
          
          if [ "$STATUS" != "success" ]; then
            echo "Alpine build timed out"
            exit 1
          fi

      - name: Wait for Debian build to complete
        if: steps.debian-find.outputs.needs_build == 'true' || github.event.inputs.force_build == 'true'
        id: debian-wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.debian-trigger.outputs.debian_run_id }}"
          echo "Waiting for Debian build $RUN_ID to complete..."
          
          for i in {1..180}; do  # Wait up to 30 minutes (180 * 10s)
            STATUS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              | jq -r '.conclusion')
            
            if [ "$STATUS" = "success" ]; then
              echo "Debian build completed successfully"
              echo "debian_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ] || [ "$STATUS" = "timed_out" ]; then
              echo "Debian build failed with status: $STATUS"
              exit 1
            fi
            echo "Debian build still running (status: ${STATUS:-unknown}), waiting..."
            sleep 10
          done
          
          if [ "$STATUS" != "success" ]; then
            echo "Debian build timed out"
            exit 1
          fi

      - name: Determine final Alpine run ID
        id: alpine-final
        run: |
          if [ "${{ steps.alpine-find.outputs.needs_build }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "alpine_run_id=${{ steps.alpine-wait.outputs.alpine_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "alpine_run_id=${{ steps.alpine-find.outputs.alpine_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine final Debian run ID
        id: debian-final
        run: |
          if [ "${{ steps.debian-find.outputs.needs_build }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "debian_run_id=${{ steps.debian-wait.outputs.debian_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "debian_run_id=${{ steps.debian-find.outputs.debian_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from Alpine BUILD-INFO.txt
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ALPINE_RUN="${{ steps.alpine-final.outputs.alpine_run_id }}"
          DEBIAN_RUN="${{ steps.debian-final.outputs.debian_run_id }}"
          
          # Verify both builds have artifacts
          ALPINE_ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ALPINE_RUN/artifacts" \
            | jq -r '.artifacts[]?.name' | grep -c 'pdfcraft-alpine-x86_64' 2>/dev/null || echo 0)
          
          DEBIAN_ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$DEBIAN_RUN/artifacts" \
            | jq -r '.artifacts[]?.name' | grep -c 'pdfcraft-debian-amd64' 2>/dev/null || echo 0)
          
          if [ "$ALPINE_ARTIFACTS" -eq 0 ] || [ "$DEBIAN_ARTIFACTS" -eq 0 ]; then
            echo "One or both builds missing artifacts"
            exit 1
          fi
          
          # Download Alpine artifact to extract version from BUILD-INFO.txt
          mkdir -p version-extract
          RUN="$ALPINE_RUN"
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
            | jq -r '.artifacts[] | select(.name == "pdfcraft-alpine-x86_64") | .archive_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Alpine artifact download URL"
            exit 1
          fi
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o version-extract/alpine.zip "$DOWNLOAD_URL"
          unzip -o version-extract/alpine.zip -d version-extract
          rm version-extract/alpine.zip
          
          # Extract version from BUILD-INFO.txt
          BUILD_INFO=$(find version-extract -name "BUILD-INFO.txt" | head -1)
          if [ -z "$BUILD_INFO" ] || [ ! -f "$BUILD_INFO" ]; then
            echo "Could not find BUILD-INFO.txt"
            exit 1
          fi
          BUILD_VERSION=$(grep -oE 'PdfCraft [0-9]+\.[0-9]+\.[0-9]+' "$BUILD_INFO" | head -1 | sed 's/PdfCraft //')
          if [ -z "$BUILD_VERSION" ]; then
            echo "Could not extract version from BUILD-INFO.txt"
            exit 1
          fi
          
          # If user specified a version, verify it matches
          if [ -n "${{ github.event.inputs.version }}" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
            if [ "$BUILD_VERSION" != "$EXPECTED" ]; then
              echo "Version mismatch: builds are for $BUILD_VERSION, requested $EXPECTED"
              exit 1
            fi
          fi
          
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Both builds are for version $BUILD_VERSION"

      - name: Check if unified release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.build_version }}"
          TAG="pdfcraft-$VERSION"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Unified release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unified release for $VERSION, will create"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Alpine artifacts
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p alpine-artifacts
          RUN="${{ steps.alpine-final.outputs.alpine_run_id }}"
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
            | jq -r '.artifacts[] | select(.name == "pdfcraft-alpine-x86_64") | .archive_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Alpine artifact download URL"
            exit 1
          fi
          echo "Downloading Alpine artifact from $DOWNLOAD_URL"
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o alpine-artifacts/alpine.zip "$DOWNLOAD_URL"
          unzip -o alpine-artifacts/alpine.zip -d alpine-artifacts
          rm alpine-artifacts/alpine.zip
          ls -la alpine-artifacts/

      - name: Download Debian artifacts
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p debian-artifacts
          RUN="${{ steps.debian-final.outputs.debian_run_id }}"
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
            | jq -r '.artifacts[] | select(.name == "pdfcraft-debian-amd64") | .archive_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Debian artifact download URL"
            exit 1
          fi
          echo "Downloading Debian artifact from $DOWNLOAD_URL"
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o debian-artifacts/debian.zip "$DOWNLOAD_URL"
          unzip -o debian-artifacts/debian.zip -d debian-artifacts
          rm debian-artifacts/debian.zip
          ls -la debian-artifacts/

      - name: Prepare unified release
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          cp alpine-artifacts/* release-assets/ 2>/dev/null || true
          cp debian-artifacts/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create unified release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.build_version }}"
          TAG="pdfcraft-$VERSION"
          
          gh release create "$TAG" release-assets/* \
            --title "PdfCraft $VERSION (Unified Release)" \
            --notes $'Unofficial builds from storytold/pdfcraft $TAG:\n• Alpine Linux (musl): .apk, .tar.gz\n• Debian/Ubuntu (glibc): .deb, .rpm' \
            --prerelease=false
          
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"