name: Unified PdfCraft Release

on:
  workflow_run:
    workflows:
      - "Build PdfCraft for Alpine Linux (musl)"
      - "Build PdfCraft for Debian and Ubuntu"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  check-both-succeeded:
    runs-on: ubuntu-latest
    outputs:
      alpine_run_id: ${{ steps.get-runs.outputs.alpine_run_id }}
      debian_run_id: ${{ steps.get-runs.outputs.debian_run_id }}
      version: ${{ steps.get-runs.outputs.version }}
      tag: ${{ steps.get-runs.outputs.tag }}
    steps:
      - name: Get both workflow run IDs
        id: get-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Get the triggering run IDs
          ALPINE_RUN="${{ github.event.workflow_run.id }}"
          DEBIAN_RUN=""
          
          # Find the paired run for the other workflow
          # We need to match by the same source tree (commit/tree)
          echo "Triggering workflow: ${{ github.event.workflow_run.name }}"
          echo "Triggering run ID: $ALPINE_RUN"
          
          # Get all recent runs for both workflows
          RUNS=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Build PdfCraft for Alpine Linux (musl)" or .name == "Build PdfCraft for Debian and Ubuntu") | select(.conclusion == "success") | {name: .name, id: .id, head_sha: .head_sha, created_at: .created_at}' \
            --paginate 2>/dev/null | jq -s 'sort_by(.created_at) | reverse')
          
          echo "Recent successful runs:"
          echo "$RUNS" | jq -r '.[] | "\(.name) \(.id) \(.head_sha) \(.created_at)"'
          
          # Find the latest successful run for each workflow
          ALPINE_LATEST=$(echo "$RUNS" | jq -r '.[] | select(.name == "Build PdfCraft for Alpine Linux (musl)") | .id' | head -1)
          DEBIAN_LATEST=$(echo "$RUNS" | jq -r '.[] | select(.name == "Build PdfCraft for Debian and Ubuntu") | .id' | head -1)
          
          if [ -z "$ALPINE_LATEST" ] || [ -z "$DEBIAN_LATEST" ]; then
            echo "Missing successful run for one or both workflows"
            exit 1
          fi
          
          # Verify they're from the same source tree (same head_sha)
          ALPINE_SHA=$(echo "$RUNS" | jq -r ".[] | select(.id == $ALPINE_LATEST) | .head_sha")
          DEBIAN_SHA=$(echo "$RUNS" | jq -r ".[] | select(.id == $DEBIAN_LATEST) | .head_sha")
          
          if [ "$ALPINE_SHA" != "$DEBIAN_SHA" ]; then
            echo "Source mismatch: Alpine=$ALPINE_SHA, Debian=$DEBIAN_SHA"
            exit 1
          fi
          
          # Get version from Alpine run artifacts
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$ALPINE_LATEST/artifacts --jq '.artifacts[].name')
          echo "Alpine artifacts: $ARTIFACTS"
          
          # Extract version from artifact name (pdfcraft-<version>-alpine-x86_64.tar.gz)
          VERSION=$(echo "$ARTIFACTS" | grep -oE 'pdfcraft-[0-9]+\.[0-9]+\.[0-9]+-alpine-x86_64' | head -1 | sed 's/pdfcraft-\(.*\)-alpine-x86_64/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from artifacts"
            exit 1
          fi
          
          TAG="pdfcraft-$VERSION"
          
          echo "alpine_run_id=$ALPINE_LATEST" >> "$GITHUB_OUTPUT"
          echo "debian_run_id=$DEBIAN_LATEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  create-unified-release:
    needs: check-both-succeeded
    if: needs.check-both-succeeded.outputs.alpine_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Alpine artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.check-both-succeeded.outputs.alpine_run_id }}
          path: alpine-artifacts
          pattern: pdfcraft-alpine-x86_64
          merge-multiple: true

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.check-both-succeeded.outputs.debian_run_id }}
          path: debian-artifacts
          pattern: pdfcraft-debian-amd64
          merge-multiple: true

      - name: Prepare unified release
        run: |
          mkdir -p release-assets
          cp alpine-artifacts/* release-assets/ 2>/dev/null || true
          cp debian-artifacts/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create unified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check-both-succeeded.outputs.tag }}"
          VERSION="${{ needs.check-both-succeeded.outputs.version }}"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "PdfCraft $VERSION (Unified Release)" \
              --notes "Unofficial builds from storytold/pdfcraft:
- Alpine Linux (musl): .apk, .tar.gz
- Debian/Ubuntu (glibc): .deb, .rpm" \
              --prerelease=false
          fi
          
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"